plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.bubblesessence'
version = '1.0.0'

description = 'API REST de Bubbles & Essence - jabones artesanales de glicerina'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
// Web / REST
    implementation 'org.springframework.boot:spring-boot-starter-web'

// Persistencia JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

// Validación de DTOs (Bean Validation)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

// Driver PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'

// Spring Security (autenticación + autorización por rol)
    implementation 'org.springframework.boot:spring-boot-starter-security'

// JWT (login de usuarios internos)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

// Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

// Swagger / OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

// Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

}

tasks.named('test') {
    useJUnitPlatform()
}

// El plugin de Spring Boot genera 2 jars por defecto: uno "plain" (sin
// las dependencias, no ejecutable) y el "boot jar" (el que sí corre).
// Deshabilitamos el plain para que quede un solo .jar en build/libs/,
// y así el Dockerfile no tiene que adivinar cuál copiar.
tasks.named('jar') {
    enabled = false
}
