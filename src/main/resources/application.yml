server:
  port: ${PORT:8080}

spring:
  application:
    name: bubbles-essence

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Render free = 1 sola instancia corriendo -> un solo pool a la vez.
      # Supabase free (conexión directa) permite ~60 conexiones totales,
      # así que 5 deja margen de sobra sin acaparar el límite.
      maximum-pool-size: 5
      minimum-idle: 1
      # Libera conexiones que llevan 5 min sin usarse, en vez de
      # mantenerlas abiertas indefinidamente.
      idle-timeout: 300000
      # Recicla cada conexión cada 20 min como máximo (evita conexiones
      # "colgadas" que Supabase a veces corta por su lado sin avisar).
      max-lifetime: 1200000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    hibernate:
      # La base de datos ya existe (creada con el script SQL a mano) y usa
      # DOMINIOS personalizados en casi toda columna (tddu_activo, tddu_monto,
      # tddu_nombre, tddu_estado...). En "validate", Hibernate compara el tipo
      # crudo que reporta el JDBC metadata contra el tipo Java esperado, y para
      # una columna de dominio reporta el nombre del dominio (DISTINCT type),
      # no el tipo base -> siempre marcaría "mismatch" aunque el mapeo esté
      # bien. Por eso queda en "none": Hibernate no toca ni inspecciona el
      # esquema; la corrección del mapeo la garantizan los @Column explícitos
      # de cada entidad (y, si quieres una red de seguridad real, un test de
      # integración que levante el contexto contra la BD). Nada de
      # Flyway/Liquibase por ahora.
      ddl-auto: none

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # En prod, sobrescribe JWT_SECRET con una clave larga y aleatoria (env var).
    # Este default es SOLO para que el proyecto arranque en local sin configurar nada.
    secret: ${JWT_SECRET:bubbles-essence-clave-secreta-local-cambiar-en-produccion-32bytes+}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  security:
    # Vacío = deshabilitado. Si lo configuras (env var API_KEY), cualquier
    # request con header "X-API-KEY: <ese valor>" queda autenticada como
    # ROLE_SYSTEM, sin pasar por JWT. Pensado para llamadas máquina-a-máquina
    # o como puente mientras se integra un IdP externo (ej. AWS Cognito).
    api-key: ${API_KEY:}
  groq:
    # Variable de entorno GROQ_API_KEY con la clave de API de Groq.
    api-key: ${GROQ_API_KEY:}
    base-url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-20b
  asistente:
    info-tienda: |
      - Envíos a provincia: sí, costo aproximado S/ 25, tiempo de entrega
        aproximado 4 días.
      - Recojo en tienda: sí, en Castilla (referencia: Hospedaje San
        Valentín) - ubicación en Google Maps:
        https://www.google.com/maps/place/Hospedaje+San+Valent%C3%ADn/@-5.1915601,-80.6124201,17.25z
        Horario: lunes a viernes de 9:00 am a 9:00 pm, sábados de 12:00
        pm a 6:00 pm. Domingos cerrado.
      - Métodos de pago: Yape o Plin.
      - Para lo que no pueda resolver, deriva amablemente e incluye
        SIEMPRE el link completo (no solo el número o el @usuario):
        WhatsApp: https://wa.me/51961160436
        Instagram: https://www.instagram.com/bubbles__essence/

# URL(s) del frontend permitidas para CORS, separadas por coma si son varias.
# En Render se sobreescribe con la variable de entorno CORS_ALLOWED_ORIGINS.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    com.bubblesessence: DEBUG
    org.hibernate.SQL: DEBUG
